services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    networks:
      - caddy-net
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  caddy_data:

networks:
  caddy-net:
    external: true
